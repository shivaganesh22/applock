{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-72px)] flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="glass-card rounded-2xl p-8">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-accent-cyan to-accent-green rounded-2xl flex items-center justify-center text-2xl">
                    <i class="fas fa-lock-open"></i>
                </div>
                <h2 class="text-2xl font-bold">Welcome Back</h2>
                <p class="text-gray-500 text-sm mt-1">Enter your credentials to unlock</p>
            </div>

            <!-- Form -->
            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com"
                        class="w-full px-4 py-3 bg-white/[0.03] border border-white/[0.08] rounded-xl text-white placeholder-gray-600 focus:border-accent-cyan focus:ring-2 focus:ring-accent-cyan/20 transition-all text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Password</label>
                    <input type="password" name="password" required placeholder="Enter your password"
                        class="w-full px-4 py-3 bg-white/[0.03] border border-white/[0.08] rounded-xl text-white placeholder-gray-600 focus:border-accent-cyan focus:ring-2 focus:ring-accent-cyan/20 transition-all text-sm">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-accent-cyan to-accent-green text-white py-3.5 rounded-xl font-semibold text-sm hover:opacity-90 transition-all hover:-translate-y-0.5 hover:shadow-[0_6px_25px_rgba(6,182,212,0.3)]">
                    <i class="fas fa-arrow-right mr-2"></i> Continue to Unlock
                </button>
            </form>

            <!-- Footer -->
            <p class="text-center mt-6 text-sm text-gray-500">
                Don't have an account? <a href="{{ url_for('auth.signup') }}" class="text-accent-cyan font-medium hover:underline">Sign Up</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
